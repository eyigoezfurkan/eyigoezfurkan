<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sene Sonu İmtihanı – Geri Sayım</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="countdown-card">
    <div class="logo-wrap">
      <img src="assets/logo.png" alt="Logo" class="logo">
    </div>

    <h1 class="title">Sene Sonu İmtihanı</h1>
    <div class="divider"></div>

    <div class="timer">
      <div class="time-box">
        <span id="days">00</span>
        <label>GÜN</label>
      </div>
      <span class="colon">:</span>
      <div class="time-box">
        <span id="hours">00</span>
        <label>SAAT</label>
      </div>
      <span class="colon">:</span>
      <div class="time-box">
        <span id="minutes">00</span>
        <label>DAKİKA</label>
      </div>
      <span class="colon">:</span>
      <div class="time-box seconds-box">
        <span id="seconds">00</span>
        <label>SANİYE</label>
      </div>
    </div>

    <div class="date-display">SALI, 23 HAZİRAN 2026 – 10:00</div>

    <div class="banner">&ldquo;SIZDE YÜZ ALACAK, YÜZ VAR.&rdquo;</div>
  </main>

  <script src="script.js"></script>
</body>
</html>
